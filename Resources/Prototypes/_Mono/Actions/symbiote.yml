- type: entity
  id: ActionSymbioteLeaveHost
  name: Leave Host
  description: Crawl out of your host's skull.
  components:
  - type: InstantAction
    useDelay: 3
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_eject.png # Placeholder
    event: !type:SymbioteLeaveHostActionEvent

- type: entity
  id: ActionSymbioteDebugBond
  name: Bond (Debug)
  description: Instantly bond with a valid host, without being eaten.
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidAppearance
    canTargetSelf: false
    interactOnMiss: false
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_infest.png # Placeholder
    event: !type:SymbioteDebugBondActionEvent

- type: entity
  id: ActionSymbioteTendrilMouth
  name: Tendril Mouth
  description: Extend your tendrils into your host's mouth. Their voice becomes yours.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_control.png # Placeholder
    event: !type:SymbioteAbilityActionEvent
  - type: SymbioteAbility
    activationCost: 20
    upkeep: 2
  - type: SymbioteTendrilMouth
