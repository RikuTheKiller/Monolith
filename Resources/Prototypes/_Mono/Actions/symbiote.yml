- type: entity
  id: ActionSymbioteLeaveHost
  name: Leave Host
  description: Crawl out of your host's skull.
  components:
  - type: InstantAction
    useDelay: 3
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_eject.png # Placeholder
    event: !type:SymbioteLeaveHostActionEvent

- type: entity
  id: ActionSymbioteDebugBond
  name: Bond (Debug)
  description: Instantly bond with a valid host, without being eaten.
  components:
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidAppearance
    canTargetSelf: false
    interactOnMiss: false
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_infest.png # Placeholder
    event: !type:SymbioteDebugBondActionEvent

- type: entity
  id: ActionSymbioteCheckBlood
  name: Check Blood
  description: Analyze the bloodstream of your host, giving you a detailed view of their health.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_bloodcheck.png # Placeholder
    event: !type:SymbioteCheckBloodActionEvent
  - type: HealthAnalyzer
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface

- type: entity
  id: ActionSymbioteTendrilMouth
  name: Tendril Mouth
  description: Extend your tendrils into your host's mouth. Their voice becomes yours.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_control.png # Placeholder
    event: !type:SymbioteAbilityActionEvent
  - type: SymbioteAbility
    activationCost: 20
    upkeep: 2
  - type: SymbioteTendrilMouth

- type: entity
  id: ActionSymbioteThermalEyes
  name: Thermal Eyes
  description: Enhance your host's eyesight, granting you both thermal vision.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon: # Placeholder
      sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
      state: icon
    event: !type:SymbioteAbilityActionEvent
  - type: SymbioteAbility
    activationCost: 20
    upkeep: 2
  - type: SymbioteThermalEyes

- type: entity
  id: ActionSymbioteChemicalPump
  name: Chemical Pump
  description: Heal your host over time. If you heal them above critical, they will be revived. Rapidly taking a lot of damage will destroy the pump.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_chem.png # Placeholder
    event: !type:SymbioteAbilityActionEvent
  - type: SymbioteAbility
    activationCost: 60
    upkeep: 10
  - type: SymbioteChemicalPump
    sprite:
      sprite: _Mono/Mobs/Aliens/Symbiote/chemical_pump.rsi
      state: pulse
    tiers:
    - effectiveness: 1 # Physical
      types: [ Blunt, Slash, Piercing, Heat, Shock, Cold, Caustic ]
    - effectiveness: 0.5 # Common non-physical
      types: [ Asphyxiation, Bloodloss, Poison ]
      blood: true
    - effectiveness: 0.2 # Rare non-physical
      types: [ Radiation, Cellular ]
